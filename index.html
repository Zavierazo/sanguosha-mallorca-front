<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <!--
      interactive-widget=resizes-content: al abrirse el teclado del móvil, el
      navegador encoge la página entera en vez de sólo la parte visible. Sin
      esto (el comportamiento por defecto de Chrome y Firefox para Android), el
      modal de partida perseguía con JS una vista que el navegador desplazaba,
      y quedaba un hueco entre el modal y el teclado. Safari lo ignora; ahí
      sigue valiendo la medición con visualViewport de RankingModal.tsx.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="App for Sanguosha Mallorca utilities" />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>Sanguosha Mallorca</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
